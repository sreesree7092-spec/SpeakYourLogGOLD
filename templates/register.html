
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak Your Log | Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-wrapper">
        <section class="auth-card">
            <div class="brand-mark">SYL</div>
            <h1>Create Your Account</h1>
            <p class="subtitle">Start your personal growth journey today.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <label for="name">Full name</label>
                <input id="name" type="text" name="name"
                       placeholder="Enter your name" required>

                <label for="email">Email address</label>
                <input id="email" type="email" name="email"
                       placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" type="password" name="password"
                       minlength="8" placeholder="At least 8 characters" required>

                <label for="user_field">Your role or field</label>
                <input id="user_field" type="text" name="user_field"
                       placeholder="Student, Designer, Professional..." required>

                <label for="language">Preferred language</label>
                <select id="language" name="language" required>
                    <option value="en">English</option>
                    <option value="ta">தமிழ்</option>
                </select>

                <label for="goal">Personal growth goal</label>
                <input id="goal" type="text" name="goal"
                       placeholder="What would you like to improve?" required>

                <button type="submit" class="primary-button">Create Account</button>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="{{ url_for('login') }}">Login here</a>
            </p>
        </section>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
